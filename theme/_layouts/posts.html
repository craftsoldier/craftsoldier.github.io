---
layout: default
---

<div class="wrapper">
  <h1>{{ page.title }}</h1>

  {% for post in site.posts %}
    <article class="post">
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <p class="post-meta">{{ post.date | date: "%d/%m/%Y" }}</p>
      {{ post.excerpt }}
      <a href="{{ post.url | relative_url }}">Read more →</a>
    </article>
  {% endfor %}
</div>
