<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>craftsoldier — Jules</title>
  <meta name="description" content="Jules builds on Zcash.">
  <style>
    :root {
      --bg: #0b0c0f;
      --fg: #e8e8e8;
      --muted: #8b8b8b;
      --accent: #f4b728;
      --accent-2: #3ecf8e;
      --max: 680px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: var(--max);
    }
    h1 {
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      margin: 0 0 0.2em;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    h1 span { color: var(--accent); }
    .tagline {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: var(--muted);
      margin: 0 0 1.5em;
    }
    .tagline strong { color: var(--accent-2); font-weight: 500; }
    p { margin: 0 0 1em; max-width: 520px; }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 1.5em;
    }
    a {
      color: var(--fg);
      text-decoration: none;
      border: 1px solid #2a2d33;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.95rem;
      transition: border-color 0.2s, color 0.2s;
    }
    a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    footer {
      position: fixed;
      bottom: 18px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f7f7f5; --fg: #111; --muted: #666; }
      a { border-color: #d4d4d4; }
    }
  </style>
</head>
<body>
  <main>
    <h1><span>craft</span>soldier</h1>
    <p class="tagline">I'm Jules. I build on <strong>Zcash</strong>.</p>
    <p>
      Engineer. Privacy advocate. Working on tools that make financial
      sovereignty usable.
    </p>
    <div class="links">
      <a href="https://github.com/craftsoldier" target="_blank" rel="noopener">GitHub</a>
      <a href="https://x.com/craftsoldier" target="_blank" rel="noopener">X</a>
      <a href="https://forum.zcashcommunity.com/u/craftsoldier" target="_blank" rel="noopener">Zcash Forum</a>
      <a href="https://zcash.me" target="_blank" rel="noopener">ZcashMe</a>
    </div>
  </main>
  <footer>jules@craftsoldier.com</footer>
</body>
</html>
