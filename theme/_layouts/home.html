---
layout: default
---

<div class="wrapper">
{% for post in site.posts %}
  <article class="post">
    <h1><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h1>
    <p class="post-meta">{{ post.date | date: "%d/%m/%Y" }}</p>
    {{ post.excerpt }}
    <a href="{{ post.url | relative_url }}">Read more</a>
  </article>
{% endfor %}
</div>
